# Pinned research environment for liquid-ai: evaluation, scoring and LoRA training.
# This is the ONE environment used for every published number.
#
# Recreate (GPU host, from the repo root):
#   export UV_PROJECT_ENVIRONMENT=/data/code-switching/envs/liquid-ai-research
#   uv sync --locked
#
# Full rationale for each pin: docs/environment.md
# Not a Python package (no build system); uv only manages the environment.

[project]
name = "liquid-ai-research"
version = "0.1.0"
description = "Pinned research environment: JA-EN code-switching ASR eval, scoring and LoRA training (LFM2.5-Audio, Whisper)."
requires-python = "==3.12.*"
dependencies = [
    # --- GPU stack: CUDA 12.6 wheels from the pytorch-cu126 index (see [tool.uv.sources]).
    # The 565.x driver supports at most CUDA 12.7; default PyPI torch is a CUDA 13 build.
    # torchaudio 2.11.0 is the last torchaudio release (cu126 and PyPI alike). Its
    # compiled extension is built against torch 2.11.0 and its metadata does NOT pin
    # torch, so torch is held at 2.11.0 by hand to keep the ABI matched.
    "torch==2.11.0",
    "torchaudio==2.11.0",
    # --- Models / fine-tuning
    "liquid-audio==1.3.0",           # requires Python >=3.12
    "transformers==4.57.6",          # last 4.x; liquid-audio 1.3.0's upstream lock tests 4.56.1
    "peft==0.21.0",
    "accelerate==1.15.0",
    "datasets==4.8.5",               # liquid-audio 1.3.0's upstream lock tests 4.8.4; stay on 4.x
    "huggingface-hub>=0.34.0,<1.0",  # required range of transformers 4.57
    "safetensors",
    "wandb",                         # imported at module top level by 03-training/asr-ft/train_lora.py
    # --- Audio I/O
    "numpy",
    "soundfile",
    "librosa",
    # --- Scoring. ONE pinned MeCab dictionary: unidic-lite. Do NOT add the full
    # `unidic` package: fugashi.Tagger() prefers it when present, which would
    # silently change JA-WER segmentation.
    "jiwer",
    "fugashi==1.5.2",
    "unidic-lite==1.0.8",
    "regex",
    # --- Data / tooling
    "pyarrow",
    "pandas",
    "tqdm",
    "pytest",
]

[project.optional-dependencies]
# Not used for published numbers; install with `uv sync --locked --extra extras`.
# faster-whisper (CTranslate2) CUDA kernels fail on the 565.x driver
# (cudaErrorUnsupportedPtxVersion); Whisper numbers come from eval/run_whisper_hf.py.
extras = [
    "streamlit",
    "faster-whisper",
]

[tool.uv]
package = false
required-version = ">=0.12.5"
# Lock only for the GPU host platform (RHEL 9, x86_64).
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[tool.pytest.ini_options]
testpaths = ["04-evaluation/eval-ft/tests", "common/tests"]
